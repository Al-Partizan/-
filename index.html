<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
    }

    .calc {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.35rem;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      margin-bottom: 14px;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #cfd6dd;
      border-radius: 8px;
    }

    input:focus {
      outline: 2px solid #2b6cb0;
      border-color: #2b6cb0;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button.add {
      background: #2b6cb0;
      color: #fff;
    }

    button.clear {
      background: #e8edf2;
      color: #1a1a1a;
    }

    .result {
      min-height: 1.5em;
      padding: 12px;
      background: #f4f6f8;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .result.error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <main class="calc">
    <h1>Калькулятор</h1>
    <label for="num1">Число 1</label>
    <input id="num1" type="text" inputmode="decimal" autocomplete="off">
    <label for="num2">Число 2</label>
    <input id="num2" type="text" inputmode="decimal" autocomplete="off">
    <div class="buttons">
      <button type="button" class="add" id="addBtn">Сложить</button>
      <button type="button" class="clear" id="clearBtn">Очистить</button>
    </div>
    <div class="result" id="result"></div>
  </main>
  <script>
    const num1 = document.getElementById("num1");
    const num2 = document.getElementById("num2");
    const result = document.getElementById("result");
    const ERROR_TEXT = "Введите два числа";

    function parseNumber(value) {
      const trimmed = value.trim().replace(",", ".");
      if (trimmed === "") return NaN;
      return Number(trimmed);
    }

    document.getElementById("addBtn").addEventListener("click", function () {
      const a = parseNumber(num1.value);
      const b = parseNumber(num2.value);

      if (!Number.isFinite(a) || !Number.isFinite(b)) {
        result.textContent = ERROR_TEXT;
        result.classList.add("error");
        return;
      }

      result.classList.remove("error");
      result.textContent = a + b;
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      num1.value = "";
      num2.value = "";
      result.textContent = "";
      result.classList.remove("error");
    });
  </script>
</body>
</html>
